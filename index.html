<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F1319" media="(prefers-color-scheme: dark)">
    <title>SpaceX rocket catalog</title>
    <script>
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('rocket-catalog:color-scheme')
        } catch (error) {
          stored = null
        }
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.documentElement.style.backgroundColor = dark ? '#0F1319' : '#F5F6F8'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
